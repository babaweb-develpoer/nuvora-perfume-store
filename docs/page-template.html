<!doctype html>
<!--
  STANDARD PAGE SKELETON (binding for Tasks 8-17). Copy this file to <page>.html.

  - Replace every TODO. Keep the <head> order: meta, preconnect + fonts, CSS, config.js (last).
  - <body data-nav="...">: ui.js auto-mounts the shell (header, optional notice strip, footer,
    cart drawer, search overlay, toast host, WhatsApp button) on DOMContentLoaded and
    marks the matching nav link aria-current="page".
      data-nav keys: shop | brands | quiz | about | contact  (anything else = no active link)
  - Hero pages: add data-header="overlay" to <body> so the header floats transparent over
    the first section until scroll. The first section must then pad its own top by
    var(--header-h).
  - Fixed bottom bars (sticky add-to-cart on product.html, checkout summary bar): add
    class="has-bottom-bar" to <body> so the floating WhatsApp button moves up above the
    bar. Default lift is 72px; set style="--bottom-bar-h: <bar height>px" on <body> if
    your bar is a different height. The button also fades away by itself whenever a
    control (or any element marked data-fab-avoid, e.g. the order totals) sits under it.
  - <body data-shell="off"> skips the shell (e.g. a print view). Never needed normally.
  - Write NO header/footer markup yourself. Put page content inside <main id="main">.
  - Scripts are classic (no type="module": it fails on file://). Keep this exact order (config.js lives in the <head>, see there),
    then your page script last. Pages without a page script simply omit that line.
  - After injecting markup that contains .reveal elements, call Shop.ui.reveal().
  - Product cards: Shop.ui.productCard(product). Wishlist hearts and quick-add buttons
    are handled by ui.js delegation; do not add listeners for them.
  - Images and videos: Shop.ui.media('<slot id>', { eager, className, sizes, alt }).
    Missing files fall back to the .ph placeholder automatically.
  - Any form that collects personal data must declare method="post" action="#" so a no-JS or aborted-init submit never puts data in the URL (only search and filter forms stay method="get").
  - All dynamic text through Shop.util.escapeHtml. Page styles go in assets/css/pages.css.
-->
