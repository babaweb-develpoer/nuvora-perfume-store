<!doctype html>
<!--
  Not-found page. Hosts serve this file at whatever URL was missed, so in a
  nested path (/a/b/missing) these relative asset and link paths would not
  resolve. We keep relative paths on purpose: the site must also open straight
  from file://, where a root-relative or <base href="/"> would break everything.
  Known limit: a mistyped address nested more than one folder deep (/a/b/missing)
  shows this page's text without its styles. Netlify and GitHub Pages serve this
  file by itself, so no redirect is needed (see README, Deploy).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Nuvora</title>
  <meta name="description" content="This page could not be found. Search the collection, or head back to our fragrances, the scent quiz or our contact details.">
  <meta name="theme-color" content="#0B0B0C">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nuvora">
  <meta property="og:title" content="Page not found | Nuvora">
  <meta property="og:description" content="This page could not be found. Search the collection, or head back to our fragrances, the scent quiz or our contact details.">
  <meta property="og:image" content="https://babaweb-develpoer.github.io/nuvora-perfume-store/assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts: Cormorant Garamond 300-600 (+ italic) and Inter 300-600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <!-- config.js is tiny and synchronous: with demoBanner off it tags <html class="no-banner"> before first paint -->
  <script src="assets/js/config.js"></script>
</head>
<body class="page-404" data-nav="">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">

    <!-- hero-2 full bleed (the bottle and its curl of smoke on the right), the
         message, search and links on its empty left -->
    <section class="nf-hero" aria-labelledby="nf-title">
      <div class="nf-hero__stage" aria-hidden="true" data-media="hero-2" data-decorative data-eager></div>
      <div class="nf-hero__inner container">
        <div class="nf-hero__copy">
          <h1 class="nf-hero__title" id="nf-title">This page has evaporated</h1>
          <p class="nf-hero__lead">The link may be old, or the page has moved. Search for what you came for, or pick up from one of the places below.</p>

          <form class="nf-search" role="search" method="get" action="shop.html">
            <label class="sr-only" for="nf-q">Search fragrances, houses and notes</label>
            <input class="nf-search__input" id="nf-q" type="search" name="q" placeholder="Oud, rose, a house..." autocomplete="off" enterkeyhint="search">
            <button type="submit" class="nf-search__btn" aria-label="Search"><span data-icon="search"></span></button>
          </form>

          <nav class="nf-links" aria-label="Where to go next">
            <ul class="nf-links__list">
              <li><a class="nf-links__link" href="index.html">Home</a></li>
              <li><a class="nf-links__link" href="shop.html">Shop all fragrances</a></li>
              <li><a class="nf-links__link" href="scent-quiz.html">Find your scent</a></li>
              <li><a class="nf-links__link" href="contact.html">Contact us</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </section>

    <section class="section nf-best" aria-labelledby="nf-best-title">
      <div class="container">
        <h2 class="nf-best__title" id="nf-best-title">Or start with a favourite</h2>
        <ul class="nf-best__grid" data-bestsellers data-limit="3"></ul>
      </div>
    </section>

  </main>

  <script src="assets/js/media-manifest.js"></script>
  <script src="assets/js/products.js"></script>

  <script src="assets/js/pricing.js"></script>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/content.js"></script>
</body>
</html>
