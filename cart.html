<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag | Nuvora</title>
  <meta name="description" content="Review the fragrances in your bag, add gift wrap, apply a discount code and see your total in PKR before paying cash on delivery anywhere in Pakistan.">
  <meta name="theme-color" content="#0B0B0C">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Nuvora">
  <meta property="og:title" content="Your bag | Nuvora">
  <meta property="og:description" content="Review the fragrances in your bag, add gift wrap, apply a discount code and see your total in PKR before paying cash on delivery anywhere in Pakistan.">
  <meta property="og:image" content="https://babaweb-develpoer.github.io/nuvora-perfume-store/assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts: Cormorant Garamond 300-600 (+ italic) and Inter 300-600 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap">

  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <!-- config.js is tiny and synchronous: with demoBanner off it tags <html class="no-banner"> before first paint -->
  <script src="assets/js/config.js"></script>
</head>
<body class="page-cart" data-nav="cart">
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <div class="container bag">
      <header class="bag-head">
        <h1 class="bag-head__title" tabindex="-1">Your bag<span class="bag-head__count" data-bag-count></span></h1>
        <p class="bag-head__lead" data-bag-lead>Original, sealed bottles. You pay the courier in cash when your order arrives.</p>
      </header>

      <!-- Filled by cart.js: the bag (lines + order summary) or the empty state. -->
      <div data-bag-root></div>
    </div>

    <p class="sr-only" role="status" aria-live="polite" data-live></p>
  </main>

  <script src="assets/js/media-manifest.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/catalogue.js"></script>
  <script src="assets/js/quiz.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/pages/cart-shared.js"></script>
  <script src="assets/js/pages/cart.js"></script>
</body>
</html>
